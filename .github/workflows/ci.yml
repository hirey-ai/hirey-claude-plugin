name: Plugin CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_bootstrap.py -v
      - run: bash -n install.sh
      - run: python -m json.tool .claude-plugin/marketplace.json >/dev/null
      - run: python -m json.tool plugins/hirey-hi/.claude-plugin/plugin.json >/dev/null
      - name: Check pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA"...HEAD
